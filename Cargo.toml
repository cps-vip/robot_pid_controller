[package]
name = "robot_pid_controller"
version = "0.1.0"
edition = "2024"

[dependencies]
aarch32-cpu = { version = "0.4", features = ["critical-section-single-core"] }
zynq7000-rt = "0.4"
zynq7000-hal = { version = "0.2", features = ["time-driver-gtc"] }

embassy-executor = { version = "0.10", features = [
  "platform-cortex-ar",
  "executor-thread",
] }
embassy-time = { version = "0.5", features = ["tick-hz-1_000_000"] }

pid = "4.0.0"
critical-section = "1.2.0"
nb = "1.1.0"
log = "0.4"
embedded-io = "0.7"
panic-halt = "1.0.0"

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true
